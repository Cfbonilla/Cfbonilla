<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu entrada · Registro de entrada a eventos</title>
  <link rel="icon" href="sprite.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
<header class="brand">
  <div class="topbar"><button id="theme-toggle" type="button" class="secondary">☾ OSCURO</button></div>
  <img class="sprite" src="sprite.svg" alt="">
  <h1>Registro de entrada a eventos</h1>
  <p class="eyebrow">★ <span id="event">Navidad Paraíso 2026</span> ★</p>
</header>
<main>
  <div id="ticket" class="card ticket hidden">
    <span class="badge">ENTRADA PERSONAL</span>
    <h1 id="name"></h1>
    <p id="area" class="sub" style="margin-bottom:10px"></p>
    <div id="guests-wrap" class="hidden">
      <strong class="pixel" style="font-size:11px">ACOMPAÑANTES</strong>
      <ul id="guests" class="guests"></ul>
    </div>
    <img id="qr" alt="Código QR de la entrada">
    <div class="code" id="code"></div>
    <div id="status"></div>
    <p class="sub" style="margin-top:16px">Guarda esta página o toma una captura de pantalla y presenta el QR en la entrada. El código es personal y solo se puede usar <strong>una vez</strong>.</p>
    <div class="row" style="justify-content:center">
      <button onclick="print()">⎙ Imprimir / PDF</button>
    </div>
  </div>
  <div id="err" class="alert bad hidden"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const code = new URLSearchParams(location.search).get('code') || '';
  fetch('/api/tickets/' + encodeURIComponent(code)).then(async (r) => {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const t = d.ticket;
    $('event').textContent = d.eventName;
    document.title = 'Tu entrada · ' + d.eventName;
    $('name').textContent = t.worker_name;
    $('area').textContent = `C.I. ${t.id_masked} · Área: ${t.work_area}`;
    if (t.companion_names.length) {
      for (const g of t.companion_names) $('guests').append(Object.assign(document.createElement('li'), { textContent: g }));
      $('guests-wrap').classList.remove('hidden');
    }
    $('qr').src = `/api/tickets/${encodeURIComponent(t.code)}/qr.png`;
    $('code').textContent = t.code;
    $('status').innerHTML = t.checked_in_at
      ? `<div class="alert warn"><span class="title">Entrada ya utilizada</span></div>`
      : `<div class="alert ok"><span class="title">★ ¡Entrada válida! ★</span>${1 + t.companions} persona(s) pueden ingresar</div>`;
    $('ticket').classList.remove('hidden');
  }).catch((e) => { $('err').textContent = e.message || 'Entrada no encontrada.'; $('err').classList.remove('hidden'); });
</script>
</body>
</html>
