name: Update profile art

on:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/fetch-contributions.mjs
      - name: Build SVGs
        run: node scripts/build-profile.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet || (git commit -m "Update profile art" && git push)
